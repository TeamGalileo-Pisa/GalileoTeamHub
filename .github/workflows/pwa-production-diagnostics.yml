name: PWA production diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Locate Chrome
        shell: bash
        run: |
          set -euxo pipefail
          which google-chrome || which google-chrome-stable || which chromium || which chromium-browser
          google-chrome --version || google-chrome-stable --version || chromium --version || chromium-browser --version

      - name: Start headless Chrome
        shell: bash
        run: |
          set -euxo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --remote-debugging-port=9222 --user-data-dir=/tmp/galileo-pwa-chrome about:blank >/tmp/chrome.log 2>&1 &
          echo $! >/tmp/chrome.pid
          sleep 3

      - name: Diagnose production installability
        env:
          PWA_TARGET: https://galileohub.info-teamgalileo.workers.dev
        run: node scripts/diagnose-pwa-production.mjs

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pwa-production-diagnostics
          path: |
            pwa-production-diagnostics.json
            /tmp/chrome.log
          if-no-files-found: warn
